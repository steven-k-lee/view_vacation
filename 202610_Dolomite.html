<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Loading vacation plan...</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      place-items: center;
      background: #f4f7f3;
      color: #193126;
    }

    main {
      width: min(34rem, calc(100% - 3rem));
      padding: 2rem;
      border: 1px solid #cbd8cf;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(25 49 38 / 12%);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    p {
      line-height: 1.6;
    }

    code {
      overflow-wrap: anywhere;
    }

    .error {
      color: #a32121;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #101713;
        color: #e4eee8;
      }

      main {
        border-color: #394b40;
        background: #18221c;
        box-shadow: none;
      }

      .error {
        color: #ff9b9b;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="status-title">Loading vacation plan...</h1>
    <p id="status-message" role="status" aria-live="polite">
      Reading the itinerary from the private repository.
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const repositoryOwner = "steven-k-lee";
      const repositoryName = "vacation_planning";
      const titleElement = document.getElementById("status-title");
      const messageElement = document.getElementById("status-message");
      const requestedUrl = new URL(window.location.href);
      const token = requestedUrl.searchParams.get("token");

      requestedUrl.searchParams.delete("token");
      window.history.replaceState(null, "", requestedUrl);

      function showError(message) {
        document.title = "Unable to load vacation plan";
        titleElement.textContent = "Unable to load vacation plan";
        messageElement.className = "error";
        messageElement.textContent = message;
      }

      function getRepositoryPath() {
        const fileName = decodeURIComponent(
          window.location.pathname.split("/").pop() || ""
        );
        const pageName = fileName.replace(/\.html?$/i, "");

        if (!/^[a-z0-9][a-z0-9_-]*$/i.test(pageName)) {
          throw new Error("The page filename is not a valid repository path.");
        }

        return `${pageName}/index.html`;
      }

      async function loadVacationPlan() {
        if (!token) {
          showError(
            "A GitHub personal access token is required. Add it as ?token=YOUR_PAT to this page's URL."
          );
          return;
        }

        let repositoryPath;
        try {
          repositoryPath = getRepositoryPath();
        } catch (error) {
          showError(error.message);
          return;
        }

        const endpoint = new URL(
          `https://api.github.com/repos/${repositoryOwner}/${repositoryName}/contents/${repositoryPath}`
        );

        let response;
        try {
          response = await fetch(endpoint, {
            headers: {
              Accept: "application/vnd.github.raw+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28"
            },
            cache: "no-store"
          });
        } catch (error) {
          showError(`GitHub could not be reached: ${error.message}`);
          return;
        }

        if (!response.ok) {
          const messages = {
            401: "GitHub rejected the token. Check that it is valid.",
            403: "The token is not allowed to read this repository, or its API limit was reached.",
            404: `The repository file ${repositoryPath} was not found.`
          };
          showError(
            messages[response.status] ||
              `GitHub returned ${response.status} ${response.statusText}.`
          );
          return;
        }

        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      }

      loadVacationPlan();
    })();
  </script>
</body>
</html>
